[package]
name = "pion-computer-use-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Native capture only; no RemoteDesktop/input connection.
[dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
tokio = { version = "=1.52.3", features = ["rt", "macros", "sync", "time", "signal"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
futures-util = "=0.3.32"
png = "=0.17.16"
base64 = "=0.22.1"
pipewire = "=0.9.2"
