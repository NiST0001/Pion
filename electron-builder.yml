appId: io.github.nist0001.pion
productName: Pion
copyright: Copyright © 2026 Pion contributors

publish:
  provider: github
  releaseType: release

directories:
  output: dist

# pi 包会被 RpcClient 以系统 node 子进程执行；asar 是 Electron 虚拟文件系统，
# 系统 node 读不到，必须把 node_modules 解出 asar 供子进程直接访问。
asarUnpack:
  - node_modules/**/*
  # Pion's SDK RPC host and any shared chunks are executed by system Node.
  - out/main/**/*

files:
  - out/**
  - package.json
  - LICENSE

linux:
  category: Development
  icon: build/icon.png
  maintainer: Pion contributors <noreply@github.com>
  target:
    - AppImage
    - deb

win:
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Pion
